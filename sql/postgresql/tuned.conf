# PostgreSQL server settings for the TPC-DS power run (one query at a time) on the
# test machine: 64 GB RAM (61 GiB usable), 22 CPU threads, NVMe SSD.
# Installed by scripts/postgresql/install.sh as conf.d/tpcds.conf (PG_CONF=tuned).
#
# Memory is sized for the same ~40 GB budget as Vertica's resource pool: a quarter
# of it as shared buffers (the usual starting point), the rest left to the OS page
# cache and to the per-operation work memory of the query. Everything else follows
# the common guidance for an analytic workload on SSD with many cores.

# --- memory -------------------------------------------------------------------
shared_buffers = 10GB
effective_cache_size = 40GB            # planner estimate: shared buffers + OS cache
work_mem = 256MB                       # per sort / hash operation and process
hash_mem_multiplier = 2.0              # hash tables may use 2 x work_mem (default)
maintenance_work_mem = 4GB             # index builds, VACUUM
huge_pages = try

# --- parallel query (22 CPU threads) ---------------------------------------------
max_worker_processes = 24
max_parallel_workers = 22
max_parallel_workers_per_gather = 16   # the planner still sizes each scan by table size
max_parallel_maintenance_workers = 8   # parallel index builds
jit = on                               # default; compiles expressions of expensive queries

# --- planner / I/O ------------------------------------------------------------------
random_page_cost = 1.1                 # SSD: random reads cost about as much as sequential ones
effective_io_concurrency = 200
maintenance_io_concurrency = 200
default_statistics_target = 1000       # 10x the default: finer histograms for the large tables

# --- write-ahead log (bulk load) ------------------------------------------------------
max_wal_size = 32GB
min_wal_size = 4GB
checkpoint_timeout = 30min
checkpoint_completion_target = 0.9
wal_buffers = 64MB

# --- connections ----------------------------------------------------------------
max_connections = 50
client_connection_check_interval = 1s  # end the query when its client is gone (time limits)
statement_timeout = '2h'               # backstop for every statement (load, index build, VACUUM);
                                       # the power run sets each query's own, shorter limit
idle_in_transaction_session_timeout = '10min'

# --- monitoring: every statement with its duration, every spill to disk -----------------
logging_collector = on
log_destination = 'jsonlog'
log_min_duration_statement = 0
log_temp_files = 0
log_file_mode = 0644
log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log'
log_rotation_size = 1GB
